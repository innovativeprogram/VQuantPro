    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #161F30;
            --accent: #00E676;
            --accent-hover: #00B359;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --border: #24334C;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); line-height: 1.7; font-size: 18px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        header { background-color: rgba(11, 15, 25, 0.95); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); position: fixed; width: 100%; top: 0; z-index: 100; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; height: 75px; }
        .logo { font-weight: 700; font-size: 24px; color: #fff; }
        .logo span { color: var(--accent); }
        nav ul { display: flex; list-style: none; gap: 30px; }
        nav a { color: var(--text-muted); text-decoration: none; font-size: 15px; font-weight: 500; transition: color 0.3s; }
        nav a:hover { color: var(--accent); }
        .hamburger { display: none; cursor: pointer; color: var(--accent); font-size: 30px; background: none; border: none; }
        .hamburger:hover { color: #ffffff; }

        @media (max-width: 900px) {
            .hamburger { display: block; }
            nav { display: none; position: absolute; top: 75px; left: 0; width: 100%; background: var(--bg-card); padding: 20px; border-bottom: 1px solid var(--border); }
            nav.active { display: block; }
            nav ul { flex-direction: column; gap: 15px; align-items: center; }
            .hero h1 { font-size: 38px; } 
            .about-grid { grid-template-columns: 1fr; text-align: center; }
        }

        .hero { padding: 200px 0 140px 0; text-align: center; background: linear-gradient(to bottom, rgba(11,15,25,0.8) 0%, rgba(11,15,25,1) 100%), url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=1200&q=75&fm=webp') center/cover no-repeat; border-bottom: 1px solid var(--border); }
        .hero h1 { font-size: 56px; font-weight: 800; line-height: 1.1; margin-bottom: 24px; color: #fff; letter-spacing: -1px; }
        .hero p { color: var(--text-muted); font-size: 20px; max-width: 800px; margin: 0 auto 40px auto; }
        .btn-primary { background-color: var(--accent); color: #0B0F19; padding: 16px 36px; border-radius: 8px; text-decoration: none; font-weight: 700; transition: all 0.3s; display: inline-block; box-shadow: 0 4px 20px rgba(0, 230, 118, 0.4); }
        .btn-primary:hover { background-color: var(--accent-hover); transform: translateY(-2px); }

        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; padding: 120px 0; }
        .about-text h2 { font-size: 38px; margin-bottom: 24px; color: #fff; line-height: 1.2; }
        .about-text p { color: var(--text-muted); margin-bottom: 20px; font-size: 17px; }
        .about-image img { width: 100%; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .section { padding: 100px 0; border-bottom: 1px solid var(--border); }
        .section-title { font-size: 38px; font-weight: 700; margin-bottom: 20px; text-align: center; color: #fff; }
        .section-subtitle { color: var(--text-muted); text-align: center; max-width: 700px; margin: 0 auto 60px auto; font-size: 18px; }

        .grid-methods { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 30px; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 40px; transition: all 0.3s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); border-color: rgba(0, 230, 118, 0.5); }
        .card h3 { font-size: 20px; margin-bottom: 16px; color: #fff; display: flex; align-items: center; gap: 10px; }
        .card h3::before { content: ""; display: block; width: 12px; height: 12px; background-color: var(--accent); border-radius: 50%; }
        .card p { color: var(--text-muted); font-size: 15px; margin-bottom: 24px; }
        .formula { background-color: rgba(11, 15, 25, 0.8); padding: 15px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; color: var(--accent); text-align: center; border-left: 4px solid var(--accent); margin-bottom: 20px; }
        .card-link { margin-top: auto; color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.3s; }
        .card-link:hover { color: #fff; letter-spacing: 0.5px; }

        .content-image { width: 100%; border-radius: 12px; margin-bottom: 40px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .lesson-section { background-color: #0d131f; padding: 80px; border-radius: 16px; border: 1px solid var(--border); max-width: 900px; margin: 40px auto; }

        .footer-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .footer-links a { color: var(--text-muted); text-decoration: none; font-size: 14px; transition: color 0.3s; }

        .cookie-btn.accept { background: #00E676; color: #0B0F19; }

<script>
    (function() {
        const banner = document.getElementById('cookie-banner');
        const acceptBtn = document.getElementById('cookie-accept');
        const rejectBtn = document.getElementById('cookie-reject');
        const prefsLink = document.getElementById('open_preferences_center');
        
        if (!localStorage.getItem('cookie-consent')) banner.style.display = 'flex';
        
        function setConsent(value) {
            localStorage.setItem('cookie-consent', value);
            banner.style.display = 'none';
            if (value === 'accepted') {
                if (typeof window.updateGA4Consent === 'function') window.updateGA4Consent();
                loadExternalScripts();
            } else {
                removeExternalScripts();
            }
        }
        
        if (acceptBtn) acceptBtn.addEventListener('click', () => setConsent('accepted'));
        if (rejectBtn) rejectBtn.addEventListener('click', () => setConsent('rejected'));
        if (prefsLink) prefsLink.addEventListener('click', (e) => { e.preventDefault(); banner.style.display = 'flex'; });
        
        if (localStorage.getItem('cookie-consent') === 'accepted') {
            if (typeof window.updateGA4Consent === 'function') window.updateGA4Consent();
            loadExternalScripts();
        }
        
        function loadExternalScripts() {
            // AdSense (opzionale)
            if (!document.querySelector('script[src*="adsbygoogle"]')) {
                var adsScript = document.createElement('script');
                adsScript.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2835044924304516';
                adsScript.async = true;
                adsScript.crossOrigin = 'anonymous';
                document.head.appendChild(adsScript);
                var fcScript = document.createElement('script');
                fcScript.src = 'https://fundingchoicesmessages.google.com/i/ca-pub-2835044924304516?ers=1';
                fcScript.async = true;
                document.head.appendChild(fcScript);
            }
            
            // Monetag - In-Page Push (zona 11093922)
            if (!document.querySelector('script[src*="nap5k.com/tag.min.js"]')) {
                var monetagInpage = document.createElement('script');
                monetagInpage.dataset.zone = '11093922';
                monetagInpage.src = 'https://nap5k.com/tag.min.js';
                document.head.appendChild(monetagInpage);
            }
            
            // PopAds (popunder)
            if (!document.querySelector('script[src*="intelligenc"]')) {
                var popadsScript = document.createElement('script');
                popadsScript.type = 'text/javascript';
                popadsScript.setAttribute('data-cfasync', 'false');
                popadsScript.textContent = `/*<![CDATA[/* */

/*]]>*/`;
                document.head.appendChild(popadsScript);
            }
        }
        
        function removeExternalScripts() {
            var scripts = document.querySelectorAll('script[src*="adsbygoogle"], script[src*="fundingchoicesmessages"], script[src*="quge5.com"], script[src*="nap5k.com"], script[src*="intelligenc"]');
            scripts.forEach(script => script.remove());
        }
    })();
    
    // ========== SPOSTA L'ANNUNCIO MONETAG IN BASSO ==========
    function moveMonetagAd() {
        var selectors = [
            '[class*="monetag"]',
            '[class*="nap5k"]',
            '[data-zone="11093922"]',
            'iframe[src*="monetag"]',
            'ins.adsbygoogle[data-ad-layout]'
        ];
        var found = false;
        for (var i = 0; i < selectors.length; i++) {
            var elem = document.querySelector(selectors[i]);
            if (elem && elem.parentNode && !elem.hasAttribute('data-moved')) {
                elem.setAttribute('data-moved', 'true');
                // Sposta in fondo al <body>, prima del footer (opzionale)
                document.body.appendChild(elem);
                found = true;
                console.log('Annuncio Monetag spostato in fondo');
                break;
            } else if (elem && elem.hasAttribute('data-moved')) {
                found = true;
            }
        }
        if (!found) {
            setTimeout(moveMonetagAd, 1000);
        }
    }
    // Avvia dopo 3 secondi (tempo per caricare l'annuncio) e ripeti ogni 5 secondi per sicurezza
    setTimeout(moveMonetagAd, 3000);
    setInterval(moveMonetagAd, 5000);
</script>
