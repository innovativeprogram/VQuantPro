    <script>
    document.addEventListener('DOMContentLoaded', function () {
        cookieconsent.run({
            notice_banner_type:"standalone",
            consent_type:"express",
            palette:"light",
            language:"it",
            page_load_consent_levels:["strictly-necessary"],

            preferences_center_close_button_hide:false,
            page_refresh_confirmation_buttons:false
        });

        // Menu hamburger: lo inizializziamo subito, non dipende da KaTeX
        const hamburger = document.querySelector('.hamburger');
        const nav = document.querySelector('nav');

        if (hamburger && nav) {
            hamburger.addEventListener('click', function(e) {
                e.preventDefault();
                nav.classList.toggle('active');
            });
        }

        // Gestione header scroll
        window.addEventListener('scroll', function() {
            const header = document.querySelector('header');
            if (header) {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            }
        });

        // KaTeX rendering - isolato per non bloccare altri script
        try {
            if (typeof renderMathInElement === 'function') {
                renderMathInElement(document.body);
            }
        } catch(e) {

                    if (typeof renderMathInElement === 'function') {
                        renderMathInElement(document.body);
                    }
                } catch(e2) {
                    console.warn('KaTeX rendering fallito');
                }
            }, 500);
        }
    });

    <style>
        :root{
            --bg-main:#0B0F19;
            --bg-card:#161F30;
            --accent:#00E676;
            --accent-hover:#00B359;
            --text-main:#F3F4F6;
            --text-muted:#9CA3AF;
            --border:#24334C;
            --gradient: linear-gradient(135deg, rgba(0,230,118,0.12), rgba(0,230,118,0));
        }

        *{ margin:0; padding:0; box-sizing:border-box; }
        html{ scroll-behavior:smooth; }
        body{
            font-family:'Inter',sans-serif;
            background:var(--bg-main);
            color:var(--text-main);
            line-height:1.7;
            overflow-x:hidden;
        }
        img{ max-width:100%; display:block; }
        .container{ max-width:1200px; margin:0 auto; padding:0 24px; }

        header{
            position:fixed; width:100%; top:0; z-index:1000;
            background:rgba(11,15,25,0.92); backdrop-filter:blur(14px);
            border-bottom:1px solid rgba(255,255,255,0.05); transition:0.3s;
        }
        header.scrolled{ box-shadow:0 10px 30px rgba(0,0,0,0.4); }
        .nav-container{ display:flex; justify-content:space-between; align-items:center; height:78px; }
        .logo{ font-size:28px; font-weight:800; letter-spacing:-1px; }
        .logo span{ color:var(--accent); }

        nav ul{ display:flex; list-style:none; gap:32px; }
        nav a{
            color:var(--text-muted); text-decoration:none; font-size:15px;
            font-weight:600; transition:0.3s; position:relative;
        }
        nav a::after{
            content:""; position:absolute; width:0; left:0; bottom:-8px;
            height:2px; background:var(--accent); transition:0.3s;
        }
        nav a:hover{ color:#fff; }
        nav a:hover::after{ width:100%; }

        .hamburger{
            display:none; font-size:30px; cursor:pointer;
            color:var(--accent); z-index:1001; background:none; border:none;
        }

        /* Hero e resto dello stile invariato... */
        .hero{
            padding:180px 0 120px; text-align:center; position:relative;
            overflow:hidden; border-bottom:1px solid var(--border);
            background: linear-gradient(to bottom, rgba(11,15,25,0.75), rgba(11,15,25,1)),
                        url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=1920&q=90')
                        center/cover no-repeat;
        }
        .hero::before{
            content:""; position:absolute; inset:0;
            background: radial-gradient(circle at top left, rgba(0,230,118,0.18), transparent 30%);
            pointer-events:none;
        }
        .hero-badge{
            display:inline-flex; align-items:center; gap:10px;
            border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.04);
            padding:10px 18px; border-radius:999px; margin-bottom:28px;
            color:#d1d5db; font-size:14px;
        }
        .hero h1{ font-size:64px; line-height:1.05; max-width:980px; margin:0 auto 28px; font-weight:900; letter-spacing:-2px; }
        .hero p{ font-size:21px; color:var(--text-muted); max-width:850px; margin:0 auto 42px; }
        .hero-buttons{ display:flex; justify-content:center; gap:18px; flex-wrap:wrap; }
        .btn-primary{
            background:var(--accent); color:#08110d; padding:16px 36px;
            border-radius:12px; font-weight:800; text-decoration:none;
            transition:0.3s; box-shadow:0 10px 35px rgba(0,230,118,0.3);
        }
        .btn-primary:hover{ transform:translateY(-4px); background:var(--accent-hover); }
        .btn-secondary{
            border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.03);
            color:#fff; padding:16px 30px; border-radius:12px; font-weight:700;
            text-decoration:none; transition:0.3s;
        }
        .btn-secondary:hover{ border-color:var(--accent); color:var(--accent); }

        .hero-stats{ margin-top:70px; display:grid; grid-template-columns:repeat(4,1fr); gap:24px; }
        .hero-stat{
            background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06);
            border-radius:18px; padding:28px; backdrop-filter:blur(10px);
        }
        .hero-stat h3{ font-size:42px; color:var(--accent); margin-bottom:8px; }
        .hero-stat p{ margin:0; font-size:15px; }

        /* ... tutte le altre classi rimangono identiche ... */

        /* Mobile */
        @media(max-width:900px){
            .hamburger{ display:block; }
            nav{
                display:none; position:absolute; top:78px; left:0;
                width:100%; background:#101827; border-bottom:1px solid var(--border);
                padding:25px;
            }
            nav.active{ display:block; }
            nav ul{ flex-direction:column; align-items:center; gap:20px; }
            .hero{ padding:160px 0 100px; }
            .hero h1{ font-size:42px; }
            .hero p{ font-size:18px; }
            .hero-stats{ grid-template-columns:1fr 1fr; }
            .about-grid{ grid-template-columns:1fr; gap:40px; padding:80px 0; }
            .section-title{ font-size:36px; }
            .lesson-section{ padding:40px 30px; }
        }

        @media(max-width:640px){
            .hero{ padding:140px 0 80px; }
            .hero h1{ font-size:32px; letter-spacing:-1px; }
            .hero p{ font-size:16px; }
            .hero-stats{ grid-template-columns:1fr; }
            .grid-methods, .research-grid{ grid-template-columns:1fr; }
            .card, .research-card{ padding:30px; }
            .about-text h2{ font-size:32px; }
            .lesson-section{ padding:30px 20px; }
            .section{ padding:70px 0; }
        }
    </style>
